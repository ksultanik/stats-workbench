<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statistics Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: tool index rail | inputs + results | sticky live distribution plot */
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#132030; --muted:#5A6A7B; --line:#DAE0E8;
  --accent:#1E5BFF; --accent-soft:rgba(30,91,255,.17);
  --signal:#D9550A; --signal-soft:rgba(217,85,10,.22);
  --muted-soft:rgba(90,106,123,.20);
  --good:#1D7F46; --bad:#C0342A;
  --font-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D131A; --surface:#141C26; --ink:#E4EBF3; --muted:#8E9DAE; --line:#243142;
    --accent:#719CFF; --accent-soft:rgba(113,156,255,.24);
    --signal:#FF8D4F; --signal-soft:rgba(255,141,79,.26);
    --muted-soft:rgba(142,157,174,.22);
    --good:#4CC27F; --bad:#FF6F62; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D131A; --surface:#141C26; --ink:#E4EBF3; --muted:#8E9DAE; --line:#243142;
  --accent:#719CFF; --accent-soft:rgba(113,156,255,.24);
  --signal:#FF8D4F; --signal-soft:rgba(255,141,79,.26);
  --muted-soft:rgba(142,157,174,.22);
  --good:#4CC27F; --bad:#FF6F62; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1.15fr);grid-template-areas:"head head head" "rail tool viz";gap:20px;max-width:1480px;margin:0 auto;padding:20px}
.top{grid-area:head;display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font:600 26px/1.1 var(--font-display);margin:0;letter-spacing:.01em;text-wrap:balance}
.brand span{color:var(--muted);font-size:14px}
.formula{font:13px var(--font-mono);color:var(--muted)}
.rail{grid-area:rail;align-self:start;position:sticky;top:20px;display:flex;flex-direction:column;gap:14px}
.rail .grp{display:flex;flex-direction:column;gap:2px}
.rail .grp-label{font:600 11px var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 10px 4px}
.rail button{all:unset;cursor:pointer;padding:7px 10px;border-radius:6px;font-size:14px;color:var(--ink);border-left:3px solid transparent}
.rail button:hover{background:var(--surface)}
.rail button[aria-current="true"]{background:var(--surface);border-left-color:var(--accent);font-weight:600}
.rail button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.toolcol{grid-area:tool;min-width:0}
.tool{padding:20px;display:flex;flex-direction:column;gap:18px}
.tool[hidden]{display:none}
.tool>header h2{font:600 22px/1.2 var(--font-display);margin:0 0 4px;text-wrap:balance}
.tool>header p{margin:0;color:var(--muted);max-width:60ch}
.form{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field[hidden]{display:none}
.field label{font-size:12.5px;font-weight:500;color:var(--muted)}
.field small{font-size:12px;color:var(--muted)}
input[type=number],input[type=text],select,textarea{font:14px var(--font-mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical;line-height:1.45}
select{font-family:var(--font-body);cursor:pointer}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.results{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:14px}
.headline .hl-label{font-size:12.5px;color:var(--muted);font-weight:500}
.headline .hl-value{font:500 32px/1.15 var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.headline .hl-sub{font:14px var(--font-mono);color:var(--accent)}
.say{margin:0;max-width:62ch}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 24px;margin:0}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv dt{color:var(--muted);font-size:13.5px}
.kv dd{margin:0;font:13.5px var(--font-mono);font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}
.verdict{align-self:flex-start;font-weight:600;font-size:13.5px;padding:5px 10px;border-radius:999px;border:1px solid}
.verdict.reject{color:var(--signal);background:var(--signal-soft);border-color:var(--signal)}
.verdict.keep{color:var(--muted);background:var(--muted-soft);border-color:var(--line)}
.verdict.warn{color:var(--bad);border-color:var(--bad)}
.hyp{font:13.5px var(--font-mono);color:var(--muted);margin:0}
.note{margin:0;font-size:13px;color:var(--muted);max-width:66ch}
.error{color:var(--bad);font-weight:500;margin:0}
.tblwrap{overflow-x:auto}
table.tbl{border-collapse:collapse;font:13px var(--font-mono);font-variant-numeric:tabular-nums;min-width:100%}
.tbl th,.tbl td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th{font:600 12px var(--font-body);color:var(--muted)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:500 13px var(--font-body);padding:7px 12px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.viz{grid-area:viz;align-self:start;position:sticky;top:20px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px}
.viz-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.eyebrow{font:600 11px var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.viz h2{font:500 17px/1.3 var(--font-mono);margin:2px 0 0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:2px;display:inline-block}
.plot-wrap{position:relative;height:380px}
canvas{display:block;touch-action:pan-y;cursor:crosshair}
.readout{font:12.5px var(--font-mono);color:var(--ink);background:var(--bg);border-radius:6px;padding:6px 10px;min-height:30px;font-variant-numeric:tabular-nums}
.caption{margin:0;font-size:13px;color:var(--muted)}
@media (max-width:1100px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "rail" "viz" "tool";gap:14px;padding:16px}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:thin}
  .rail .grp{flex-direction:row;gap:6px}
  .rail .grp-label{display:none}
  .rail button{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surface);font-size:13.5px}
  .rail button[aria-current="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .viz{position:static}
  .plot-wrap{height:250px}
  .formula{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>Statistics Workbench</h1><span>Calculators with a live distribution plot</span></div>
    <div class="formula">f(x) = (1/σ√2π) · e<sup>−(x−μ)²/2σ²</sup></div>
  </header>
  <nav class="rail" id="rail" aria-label="Tools"></nav>
  <main class="toolcol card" id="tools"></main>
  <section class="viz card" aria-label="Distribution plot">
    <div class="viz-head">
      <div><div class="eyebrow" id="vizKind">Normal distribution</div><h2 id="vizTitle"></h2></div>
      <div class="legend" id="vizLegend"></div>
    </div>
    <div class="plot-wrap"><canvas id="plot" role="img" aria-label="Distribution plot that updates with the calculator inputs"></canvas></div>
    <div class="readout" id="vizReadout">Move across the chart to read values.</div>
    <p class="caption" id="vizCaption"></p>
  </section>
</div>

<script>
// MATH-START
const M = {};
M.lnGamma = function(z){
  const g=7, c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  if(z<0.5) return Math.log(Math.PI/Math.abs(Math.sin(Math.PI*z))) - M.lnGamma(1-z);
  z-=1; let x=c[0]; for(let i=1;i<g+2;i++) x+=c[i]/(z+i);
  const t=z+g+0.5; return 0.5*Math.log(2*Math.PI)+(z+0.5)*Math.log(t)-t+Math.log(x);
};
M._gser = function(a,x){ let ap=a, sum=1/a, del=sum; for(let n=0;n<1000;n++){ ap++; del*=x/ap; sum+=del; if(Math.abs(del)<Math.abs(sum)*1e-16) break; } return sum*Math.exp(-x+a*Math.log(x)-M.lnGamma(a)); };
M._gcf = function(a,x){ const FP=1e-300; let b=x+1-a, c=1/FP, d=1/b, h=d;
  for(let i=1;i<1000;i++){ const an=-i*(i-a); b+=2; d=an*d+b; if(Math.abs(d)<FP) d=FP; c=b+an/c; if(Math.abs(c)<FP) c=FP; d=1/d; const del=d*c; h*=del; if(Math.abs(del-1)<1e-16) break; }
  return Math.exp(-x+a*Math.log(x)-M.lnGamma(a))*h; };
M.gammaP = (a,x)=> x<=0 ? 0 : (x<a+1 ? M._gser(a,x) : 1-M._gcf(a,x));
M.gammaQ = (a,x)=> x<=0 ? 1 : (x<a+1 ? 1-M._gser(a,x) : M._gcf(a,x));
M._betacf = function(a,b,x){ const FP=1e-300; const qab=a+b, qap=a+1, qam=a-1; let c=1, d=1-qab*x/qap; if(Math.abs(d)<FP) d=FP; d=1/d; let h=d;
  for(let m=1;m<=1000;m++){ const m2=2*m; let aa=m*(b-m)*x/((qam+m2)*(a+m2)); d=1+aa*d; if(Math.abs(d)<FP) d=FP; c=1+aa/c; if(Math.abs(c)<FP) c=FP; d=1/d; h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2)); d=1+aa*d; if(Math.abs(d)<FP) d=FP; c=1+aa/c; if(Math.abs(c)<FP) c=FP; d=1/d; const del=d*c; h*=del; if(Math.abs(del-1)<1e-16) break; }
  return h; };
M.betaI = function(x,a,b){ if(x<=0) return 0; if(x>=1) return 1;
  const bt=Math.exp(M.lnGamma(a+b)-M.lnGamma(a)-M.lnGamma(b)+a*Math.log(x)+b*Math.log(1-x));
  return x<(a+1)/(a+b+2) ? bt*M._betacf(a,b,x)/a : 1-bt*M._betacf(b,a,1-x)/b; };
M.normPdf = z => Math.exp(-z*z/2)/Math.sqrt(2*Math.PI);
M.normCdf = z => { if(!isFinite(z)) return z>0?1:0; const q=0.5*M.gammaQ(0.5,z*z/2); return z<0 ? q : 1-q; };
M.normSf = z => M.normCdf(-z);
M.normInv = function(p){
  if(p<=0) return -Infinity; if(p>=1) return Infinity;
  const a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00];
  const b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01];
  const c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00];
  const d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
  const pl=0.02425; let q,r,x;
  if(p<pl){ q=Math.sqrt(-2*Math.log(p)); x=(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  else if(p<=1-pl){ q=p-0.5; r=q*q; x=(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1); }
  else { q=Math.sqrt(-2*Math.log(1-p)); x=-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  const e=M.normCdf(x)-p, u=e*Math.sqrt(2*Math.PI)*Math.exp(x*x/2); return x-u/(1+x*u/2);
};
M.tPdf = (t,v) => Math.exp(M.lnGamma((v+1)/2)-M.lnGamma(v/2)-0.5*Math.log(v*Math.PI)-(v+1)/2*Math.log(1+t*t/v));
M.tCdf = (t,v) => { if(!isFinite(t)) return t>0?1:0; const tail=0.5*M.betaI(v/(v+t*t),v/2,0.5); return t>0?1-tail:tail; };
M.tSf = (t,v) => M.tCdf(-t,v);
M.chiPdf = (x,k) => x<=0 ? 0 : Math.exp((k/2-1)*Math.log(x)-x/2-(k/2)*Math.LN2-M.lnGamma(k/2));
M.chiCdf = (x,k) => M.gammaP(k/2,x/2);
M.chiSf = (x,k) => M.gammaQ(k/2,x/2);
M.fPdf = (x,a,b) => x<=0 ? 0 : Math.exp(0.5*a*Math.log(a)+0.5*b*Math.log(b)+(a/2-1)*Math.log(x)-(a+b)/2*Math.log(b+a*x)-(M.lnGamma(a/2)+M.lnGamma(b/2)-M.lnGamma((a+b)/2)));
M.fCdf = (x,a,b) => x<=0 ? 0 : M.betaI(a*x/(a*x+b),a/2,b/2);
M.fSf = (x,a,b) => x<=0 ? 1 : M.betaI(b/(b+a*x),b/2,a/2);
M.invert = function(cdf,p,lo,hi,positive){
  if(positive){ lo=0; hi=Math.max(hi,1); while(cdf(hi)<p && hi<1e8) hi*=2; }
  else { while(cdf(lo)>p && lo>-1e8) lo*=2; while(cdf(hi)<p && hi<1e8) hi*=2; }
  for(let i=0;i<200;i++){ const m=(lo+hi)/2; if(cdf(m)<p) lo=m; else hi=m; if(hi-lo<1e-12*Math.max(1,Math.abs(m))) break; }
  return (lo+hi)/2; };
M.tInv = (p,v) => M.invert(t=>M.tCdf(t,v),p,-1,1,false);
M.chiInv = (p,k) => M.invert(x=>M.chiCdf(x,k),p,0,k,true);
M.fInv = (p,a,b) => M.invert(x=>M.fCdf(x,a,b),p,0,1,true);
M.binomPmf = (k,n,p) => { if(k<0||k>n) return 0; if(p===0) return k===0?1:0; if(p===1) return k===n?1:0;
  return Math.exp(M.lnGamma(n+1)-M.lnGamma(k+1)-M.lnGamma(n-k+1)+k*Math.log(p)+(n-k)*Math.log(1-p)); };
M.poisPmf = (k,l) => k<0 ? 0 : Math.exp(k*Math.log(l)-l-M.lnGamma(k+1));
M.mean = a => a.reduce((s,x)=>s+x,0)/a.length;
M.quantile = (sorted,q) => { const h=(sorted.length-1)*q, lo=Math.floor(h), hi=Math.ceil(h); return sorted[lo]+(h-lo)*(sorted[hi]-sorted[lo]); };
// MATH-END

/* ---------- formatting & form helpers ---------- */
const $ = id => document.getElementById(id);
const val = id => $(id).value;
const num = id => { const v=$(id).value.trim(); return v==='' ? NaN : Number(v); };
const chk = id => $(id).checked;
class UserError extends Error{}
const need = (c,msg) => { if(!c) throw new UserError(msg); };
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const show = (id,on) => { const w=$('w-'+id); if(w) w.hidden=!on; };
const setLabel = (id,txt) => { const l=document.querySelector(`label[for="${id}"]`); if(l) l.textContent=txt; };
function fmt(x,d=4){
  if(x===Infinity) return '∞'; if(x===-Infinity) return '−∞'; if(!Number.isFinite(x)) return '—';
  const ax=Math.abs(x);
  if(ax!==0 && (ax>=1e7 || ax<1e-4)) return x.toExponential(3).replace(/-/g,'−');
  return (+x.toFixed(d)).toString().replace(/-/g,'−');
}
const fmtP = p => !Number.isFinite(p) ? '—' : p<1e-300 ? '< 1e−300' : p<1e-4 ? p.toExponential(2).replace(/-/g,'−') : p.toFixed(4);
const pct = p => { const v=p*100; if(v>0 && v<0.01) return '< 0.01%'; if(v<100 && v>99.99) return '> 99.99%'; return v.toFixed(2)+'%'; };
const parseList = s => s.split(/[\s,;]+/).filter(t=>t!=='').map(Number);
function parseNums(s,what){ const a=parseList(s); const bad=a.findIndex(x=>!Number.isFinite(x)); need(bad<0,`${what} contains something that isn't a number. Separate values with spaces, commas or new lines.`); return a; }
const F = (id,label,value,o={}) => `<div class="field" id="w-${id}"><label for="${id}">${label}</label><input id="${id}" type="${o.type||'number'}" step="any" value="${value}"${o.ph?` placeholder="${o.ph}"`:''}>${o.hint?`<small>${o.hint}</small>`:''}</div>`;
const S = (id,label,opts,value) => `<div class="field" id="w-${id}"><label for="${id}">${label}</label><select id="${id}">${opts.map(([v,t])=>`<option value="${v}"${String(v)===String(value)?' selected':''}>${t}</option>`).join('')}</select></div>`;
const T = (id,label,value,hint) => `<div class="field" id="w-${id}"><label for="${id}">${label}</label><textarea id="${id}" spellcheck="false">${value}</textarea>${hint?`<small>${hint}</small>`:''}</div>`;
const CB = (id,label,on) => `<div class="field" id="w-${id}"><label class="check" for="${id}"><input type="checkbox" id="${id}"${on?' checked':''}> ${label}</label></div>`;
const CONF = [['0.8','80%'],['0.9','90%'],['0.95','95%'],['0.98','98%'],['0.99','99%'],['0.999','99.9%']];
const strip = s => String(s).replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
function render(rid,o){
  let h='';
  if(o.hyp) h+=`<p class="hyp">${o.hyp}</p>`;
  if(o.headline) h+=`<div class="headline"><div class="hl-label">${o.headline.label}</div><div class="hl-value">${o.headline.value}</div>${o.headline.sub?`<div class="hl-sub">${o.headline.sub}</div>`:''}</div>`;
  if(o.verdict) h+=`<div class="verdict ${o.verdict.tone}">${o.verdict.text}</div>`;
  if(o.say) h+=`<p class="say">${o.say}</p>`;
  if(o.rows) h+=`<dl class="kv">${o.rows.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
  if(o.html) h+=o.html;
  if(o.note) h+=`<p class="note">${o.note}</p>`;
  h+=`<div class="actions">${o.actions||''}<button type="button" class="btn ghost" data-copy="${rid}">Copy results</button></div>`;
  const el=$(rid); el.innerHTML=h;
  el._text=[o.hyp?strip(o.hyp):'', o.headline?`${strip(o.headline.label)}: ${strip(o.headline.value)}${o.headline.sub?' ('+strip(o.headline.sub)+')':''}`:'', o.verdict?strip(o.verdict.text):'', ...(o.rows||[]).map(([k,v])=>`${strip(k)}: ${strip(v)}`), o.say?strip(o.say):''].filter(Boolean).join('\n');
}
const table = (head,rows) => `<div class="tblwrap"><table class="tbl"><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

/* ---------- plot engine ---------- */
const Plot = (()=>{
  const cv=$('plot'), ctx=cv.getContext('2d'); let spec=null, W=0, H=0, hoverX=null, lay=null;
  const readout=$('vizReadout'), DEF='Move across the chart to read values.';
  function C(){ const s=getComputedStyle(document.documentElement), g=n=>s.getPropertyValue(n).trim();
    return {ink:g('--ink'),muted:g('--muted'),line:g('--line'),surface:g('--surface'),bg:g('--bg'),
      accent:g('--accent'),accentSoft:g('--accent-soft'),signal:g('--signal'),signalSoft:g('--signal-soft'),mutedSoft:g('--muted-soft'),mono:g('--font-mono')}; }
  const solid=(c,k)=>({accent:c.accent,signal:c.signal,muted:c.muted,ink:c.ink}[k]||c.accent);
  const soft=(c,k)=>({accent:c.accentSoft,signal:c.signalSoft,muted:c.mutedSoft}[k]||c.accentSoft);
  function nice(min,max,count,integer){ const span=max-min||1; let step=Math.pow(10,Math.floor(Math.log10(span/count))); const e=span/count/step;
    if(e>=7.5) step*=10; else if(e>=3.5) step*=5; else if(e>=1.5) step*=2; if(integer&&step<1) step=1;
    const out=[]; for(let v=Math.ceil(min/step)*step; v<=max+step*1e-9; v+=step) out.push(+v.toFixed(10)); return out; }
  function resize(){ const r=cv.parentElement.getBoundingClientRect(), dpr=window.devicePixelRatio||1; W=r.width; H=r.height;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); cv.style.width=W+'px'; cv.style.height=H+'px'; ctx.setTransform(dpr,0,0,dpr,0,0); draw(); }
  function pill(text,x,y,color,c,align){ ctx.font=`500 11px ${c.mono}`; const w=ctx.measureText(text).width+10;
    let left = align==='left'? x : align==='right'? x-w : x-w/2; left=Math.max(2,Math.min(W-w-2,left));
    ctx.fillStyle=c.surface; ctx.strokeStyle=color; ctx.lineWidth=1; ctx.beginPath(); ctx.roundRect(left,y-9,w,18,4); ctx.fill(); ctx.stroke();
    ctx.fillStyle=color; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText(text,left+5,y+0.5); }
  function draw(){
    if(!spec||!W) return; const c=C(); ctx.clearRect(0,0,W,H);
    const narrow=W<480;
    const nBr=(spec.brackets||[]).length;
    const L=spec.scatter?50:16, R=W-16, T=18+(spec.box?30:0)+nBr*18+((spec.markers||[]).length?16:0), B=H-(spec.ticks&&spec.ticks.some(t=>t.sub)?42:28);
    const {xmin,xmax}=spec; const X=x=>L+(x-xmin)/(xmax-xmin)*(R-L);
    let ymin=0,ymax;
    if(spec.scatter){ ymin=spec.ymin; ymax=spec.ymax; }
    else { const v=[]; (spec.curves||[]).forEach(cu=>{ for(let i=0;i<=240;i++){ const y=cu.f(xmin+(xmax-xmin)*(i+0.5)/241); if(isFinite(y)) v.push(y);} }); (spec.bars||[]).forEach(b=>v.push(b.y));
      v.sort((a,b)=>a-b); let mx=v[v.length-1]||1; const q=v[Math.floor(v.length*0.95)]||mx; if(mx>q*2.5) mx=q*2.5; ymax=(mx||1)*1.08; }
    const Y=y=>B-(y-ymin)/(ymax-ymin)*(B-T); const cy=y=>Y(Math.min(isFinite(y)?y:ymax,ymax));
    lay={L,R,X,Y};
    // grid + ticks
    const ticks = spec.ticks || nice(xmin,xmax,narrow?5:8,spec.integer).map(x=>({x,label:fmt(x,3)}));
    ctx.font=`11px ${c.mono}`; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ticks.forEach(t=>{ if(t.x<xmin-1e-9||t.x>xmax+1e-9) return; const px=X(t.x); ctx.strokeStyle=c.line; ctx.globalAlpha=.6; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(px+.5,T); ctx.lineTo(px+.5,B); ctx.stroke(); ctx.globalAlpha=1;
      ctx.fillStyle=c.muted; ctx.fillText(t.label,px,B+15); if(t.sub){ ctx.fillStyle=c.accent; ctx.fillText(t.sub,px,B+30);} });
    if(spec.scatter){ nice(ymin,ymax,5).forEach(y=>{ const py=Y(y); ctx.strokeStyle=c.line; ctx.globalAlpha=.6; ctx.beginPath(); ctx.moveTo(L,py+.5); ctx.lineTo(R,py+.5); ctx.stroke(); ctx.globalAlpha=1; ctx.fillStyle=c.muted; ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.fillText(fmt(y,3),L-6,py); }); }
    ctx.strokeStyle=c.muted; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(L,B+.5); ctx.lineTo(R,B+.5); ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.rect(L,T-4,R-L,B-T+4); ctx.clip();
    // bars
    (spec.bars||[]).forEach(b=>{ const w=spec.barWidth||1, x0=X(b.x-w/2), x1=X(b.x+w/2), gap=Math.min(1.5,(x1-x0)*0.12);
      ctx.fillStyle = b.c==='hist' ? c.accentSoft : b.c ? solid(c,b.c) : c.mutedSoft; ctx.fillRect(x0+gap,Y(b.y),Math.max(1,x1-x0-2*gap),B-Y(b.y));
      if(b.c==='hist'){ ctx.strokeStyle=c.accent; ctx.lineWidth=1; ctx.strokeRect(x0+gap+.5,Y(b.y)+.5,Math.max(1,x1-x0-2*gap)-1,B-Y(b.y)-1); } });
    // curve regions then strokes
    (spec.curves||[]).forEach(cu=>{ (cu.regions||[]).forEach(([a,b,k])=>{ a=Math.max(a,xmin); b=Math.min(b,xmax); if(!(b>a)) return;
      const n=Math.max(2,Math.ceil(X(b)-X(a))); ctx.beginPath(); ctx.moveTo(X(a),B);
      for(let i=0;i<=n;i++){ const x=a+(b-a)*i/n; ctx.lineTo(X(x),cy(cu.f(x))); }
      ctx.lineTo(X(b),B); ctx.closePath(); ctx.fillStyle=soft(c,k||'accent'); ctx.fill();
      ctx.strokeStyle=solid(c,k||'accent'); ctx.lineWidth=1; [a,b].forEach(e=>{ if(e>xmin&&e<xmax){ ctx.beginPath(); ctx.moveTo(X(e)+.5,B); ctx.lineTo(X(e)+.5,cy(cu.f(e))); ctx.stroke(); } }); }); });
    (spec.curves||[]).forEach(cu=>{ ctx.beginPath(); let started=false; for(let px=L;px<=R;px+=1){ const x=xmin+(px-L)/(R-L)*(xmax-xmin), y=cu.f(x); if(!isFinite(y)&&y!==Infinity) continue; const py=cy(y); if(!started){ctx.moveTo(px,py);started=true;} else ctx.lineTo(px,py); }
      ctx.strokeStyle=solid(c,cu.color||'ink'); ctx.lineWidth=cu.width||2; ctx.setLineDash(cu.dash?[5,4]:[]); ctx.stroke(); ctx.setLineDash([]); });
    // scatter
    if(spec.scatter){ if(spec.line){ const {m,b}=spec.line; ctx.strokeStyle=c.signal; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(X(xmin),Y(m*xmin+b)); ctx.lineTo(X(xmax),Y(m*xmax+b)); ctx.stroke(); }
      spec.points.forEach(([x,y])=>{ ctx.beginPath(); ctx.arc(X(x),Y(y),4,0,7); ctx.fillStyle=c.accentSoft; ctx.fill(); ctx.strokeStyle=c.accent; ctx.lineWidth=1.5; ctx.stroke(); });
      if(spec.pred){ const [x,y]=spec.pred; ctx.beginPath(); ctx.arc(X(x),Y(y),6,0,7); ctx.fillStyle=c.signal; ctx.fill(); } }
    // hover
    if(hoverX!=null){ ctx.strokeStyle=c.ink; ctx.globalAlpha=.45; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(X(hoverX)+.5,T); ctx.lineTo(X(hoverX)+.5,B); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha=1; }
    ctx.restore();
    // markers
    const ms=(spec.markers||[]).filter(m=>isFinite(m.x)&&m.x>=xmin&&m.x<=xmax).sort((a,b)=>a.x-b.x); let lastR=-1e9, lvl=0;
    ms.forEach(m=>{ const px=X(m.x), col=solid(c,m.color||'ink'); ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.setLineDash(m.dash?[4,3]:[]); ctx.beginPath(); ctx.moveTo(px+.5,B); ctx.lineTo(px+.5,T-2); ctx.stroke(); ctx.setLineDash([]);
      ctx.font=`500 11px ${c.mono}`; const w=ctx.measureText(m.label).width+10; lvl = (px-w/2 < lastR+4) ? lvl+1 : 0; if(lvl>2) lvl=0; lastR=px+w/2;
      pill(m.label,px,T-8+lvl*20,col,c); });
    // brackets (68-95-99.7)
    (spec.brackets||[]).forEach((br,i)=>{ const y=14+(spec.box?30:0)+i*18, x0=X(Math.max(br.a,xmin)), x1=X(Math.min(br.b,xmax)); ctx.strokeStyle=c.muted; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x0,y+5); ctx.lineTo(x0,y); ctx.lineTo(x1,y); ctx.lineTo(x1,y+5); ctx.stroke();
      ctx.font=`11px ${c.mono}`; const w=ctx.measureText(br.label).width+8; ctx.fillStyle=c.surface; ctx.fillRect((x0+x1)/2-w/2,y-7,w,14); ctx.fillStyle=c.ink; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(br.label,(x0+x1)/2,y); });
    // box plot strip
    if(spec.box){ const b=spec.box, y=20; ctx.strokeStyle=c.ink; ctx.lineWidth=1.25; ctx.beginPath(); ctx.moveTo(X(b.lo),y); ctx.lineTo(X(b.q1),y); ctx.moveTo(X(b.q3),y); ctx.lineTo(X(b.hi),y);
      ctx.moveTo(X(b.lo),y-5); ctx.lineTo(X(b.lo),y+5); ctx.moveTo(X(b.hi),y-5); ctx.lineTo(X(b.hi),y+5); ctx.stroke();
      ctx.fillStyle=c.accentSoft; ctx.fillRect(X(b.q1),y-8,X(b.q3)-X(b.q1),16); ctx.strokeRect(X(b.q1)+.5,y-8+.5,X(b.q3)-X(b.q1),16);
      ctx.strokeStyle=c.signal; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(X(b.med),y-8); ctx.lineTo(X(b.med),y+8); ctx.stroke();
      (b.out||[]).forEach(o=>{ ctx.beginPath(); ctx.arc(X(o),y,3,0,7); ctx.strokeStyle=c.bad||c.signal; ctx.lineWidth=1.25; ctx.stroke(); }); }
  }
  function set(s){ spec=s; $('vizKind').textContent=s.kind||''; $('vizTitle').textContent=s.title||''; $('vizCaption').textContent=s.caption||'';
    const lg=$('vizLegend'); lg.innerHTML=(s.legend||[]).map(l=>`<span><i style="background:var(--${l.c}${l.soft?'-soft':''});${l.line?'height:3px;':''}"></i>${esc(l.t)}</span>`).join('');
    cv.setAttribute('aria-label',(s.kind||'Chart')+': '+(s.title||'')+'. '+(s.caption||''));
    if(hoverX!=null && (hoverX<s.xmin||hoverX>s.xmax)) hoverX=null;
    readout.textContent = hoverX!=null && s.hover ? s.hover(hoverX) : DEF; draw(); }
  cv.addEventListener('pointermove',e=>{ if(!spec||!lay) return; const r=cv.getBoundingClientRect(), px=e.clientX-r.left; const x=spec.xmin+(Math.max(lay.L,Math.min(lay.R,px))-lay.L)/(lay.R-lay.L)*(spec.xmax-spec.xmin);
    hoverX=x; readout.textContent = spec.hover ? spec.hover(x) : DEF; draw(); });
  cv.addEventListener('pointerleave',()=>{ hoverX=null; readout.textContent=DEF; draw(); });
